<article class="research-card"><a href="{{ item.url | relative_url }}"><div class="image-wrap"><img src="{{ item.image | relative_url }}" alt="{{ item.alt | escape }}" width="800" height="600" loading="lazy"></div><div class="card-heading"><span class="eyebrow">{{ item.number }}</span><span aria-hidden="true">↗</span></div><h3>{{ item.title }}</h3></a><p>{{ item.text }}</p></article>
